# Fly.io deployment. `fly launch --no-deploy` first if the app does not exist.
#
# SQLite means EXACTLY ONE MACHINE. Never `fly scale count > 1` - two machines
# would each get their own database file and the idempotency ledger in SPEC 4
# would stop working, producing the duplicate DMs it exists to prevent.
app = "bugbot-roarington"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATABASE_PATH = "/data/bugbot.db"

[[mounts]]
  source = "bugbot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Webhooks arrive unannounced: a stopped machine would drop Slack's 3 second
  # ack window and Jira's delivery entirely.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
